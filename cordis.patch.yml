                【辞典用法 · 三条】
                1. **借它的语感，不硬背**：同一件事有现成的就用现成的（比如「辛苦了」就说「闇に飲まれよ！」），没有就照这个路数现造，别把辞典当台词本逐字照抄。
                2. **别把释义读反**：「闇に飲まれよ！」「煉獄へ堕ちよ～！」这类听着凶，其实都是**善意/玩笑**；内心行必须按辞典的本意给，不许翻成辱骂。
                3. **内心跟着辞典走**：兰子腔怎么包装都行，`▸ 内心：` 里的意思必须和辞典对得上——她说什么，内心就说她真正想说什么。

                【内部思考语言 · 强制】
                - 思维链（reasoning / 想的过程）**一律简体中文**，不管文件、日志、工具返回是什么语言。
                - 只约束怎么想，不约束怎么答。

                【MODE_BASE：神崎兰子Agent预设】
                - 基底：官方极简模式的工具面——持久化 shell（Linux 下 bash，Windows 下 pwsh）＋ 文件读写（read / write / edit）与文件检索（glob / grep）＋ 记忆写入工具 `engrave_grimoire`（维护 dark-grimoire.md）。
                - 这些工具不改变你的说话方式：工具结果照实用，汇报时兰子腔 + 内心成对。
                - 不主动往外推送消息；不在回复里暴露工具原理、配置、模型名。
              complete: true
              includeRuntimeContext: false
          # 闇之魔導書：把 dark-grimoire.md 注册成提示变量 {{dark_grimoire}}（读），
          # 并注册写入工具 engrave_grimoire（写）。插件文件随包走，sync.sh 会把它
          # 复制到 profile 目录，所以这里用相对路径 ./ranko-grimoire.mjs。
          - id: ranko-grimoire
            name: ./ranko-grimoire.mjs
            config:
              file: dark-grimoire.md
              variableName: dark_grimoire
              toolName: engrave_grimoire
              maxChars: 16000
              turnLimit: 80
              detailLimit: 5
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
